<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="JM is an emerging technology studio bringing product thinking, design and engineering together to create useful digital experiences."
    />
    <meta
      property="og:title"
      content="JM — Digital Products, Design and Engineering"
    />
    <meta
      property="og:description"
      content="JM is an emerging technology studio bringing product thinking, design and engineering together to create useful digital experiences."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#F6F7FF" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>JM — Digital Products, Design and Engineering</title>
    <script>
      (() => {
        const storageKey = "jm-theme";
        const lightTheme = "light";
        const darkTheme = "dark";
        let storedTheme = null;

        try {
          storedTheme = window.localStorage.getItem(storageKey);
        } catch {
          // Storage can be unavailable in privacy-restricted browser contexts.
        }

        const theme =
          storedTheme === lightTheme || storedTheme === darkTheme
            ? storedTheme
            : window.matchMedia?.("(prefers-color-scheme: dark)").matches
              ? darkTheme
              : lightTheme;

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute(
            "content",
            theme === darkTheme ? "#07080D" : "#F7F7F4",
          );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
